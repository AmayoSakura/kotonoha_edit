<!doctype html>
<html lang="ja" data-theme="sepia">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="dynamic-font-link"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600&family=Sawarabi+Mincho&display=swap"
    />

    <style id="page-size-style">
      @page {
        size: 210mm 297mm;
        margin: 0;
      }
    </style>
    <title>言ノ葉Editer v0.11</title>

    <style>
      @layer base, layout, editor, viewer, print;

      @layer base {
        :root {
          color-scheme: dark;
          --bg: #121316;
          --panel: #1a1b1e;
          --panel-sub: #16171a;
          --input-bg: #101113;
          --text: #e6e6e6;
          --muted: #8c8c8c;
          --line: #2c2d33;
          --accent: #c29b61;
          --accent-dark: #a67c43;
          --accent-soft: rgba(194, 155, 97, 0.12);
          --shadow: 0 16px 40px rgba(0, 0, 0, 0.5);

          --paper-w: 210mm;
          --paper-h: 297mm;
          --doc-font-size: 10.5pt;
          --doc-font-family:
            "Shippori Mincho", "Yu Mincho", "游明朝", "YuMincho",
            "Hiragino Mincho ProN", "Noto Serif JP", serif;
          --ui-font-family:
            -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
            "Meiryo", sans-serif;
          --page-padding-v: 18mm;
          --page-padding-h: 14mm;
        }

        [data-theme="standard"] {
          color-scheme: light;
          --bg: #f5f4f0;
          --panel: #ffffff;
          --panel-sub: #faf9f6;
          --input-bg: #ffffff;
          --text: #1a1917;
          --muted: #737068;
          --line: #e2ded4;
          --accent: #8c6239;
          --accent-dark: #6e4c2b;
          --accent-soft: rgba(140, 98, 57, 0.08);
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        [data-theme="sepia"] {
          color-scheme: light;
          --bg: #eee8dc;
          --panel: #f7f3eb;
          --panel-sub: #f0eae1;
          --input-bg: #fffcf7;
          --text: #2b2521;
          --muted: #7d7268;
          --line: #dcd2c4;
          --accent: #9e6a3f;
          --accent-dark: #7a502f;
          --accent-soft: rgba(158, 106, 63, 0.1);
          --shadow: 0 12px 32px rgba(43, 37, 33, 0.08);
        }

        * {
          box-sizing: border-box;
        }

        html,
        body {
          height: 100%;
          overflow: hidden;
        }

        html {
          font-family: var(--ui-font-family);
          background: var(--bg);
          color: var(--text);
          letter-spacing: 0.01em;
        }

        body {
          margin: 0;
        }

        button,
        input,
        textarea,
        select {
          font-family: var(--ui-font-family);
          font-size: 0.9rem;
        }

        button {
          cursor: pointer;
        }

        button:disabled {
          opacity: 0.4;
          cursor: not-allowed;
        }
      }

      @layer layout {
        .app {
          width: min(1600px, calc(100% - 32px));
          height: 100vh;
          margin: 0 auto;
          padding: 16px 0;
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
        }

        .hero {
          margin-bottom: 16px;
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          border-bottom: 1px solid var(--line);
          padding-bottom: 12px;
          flex-shrink: 0;
        }

        .hero-title-group {
          display: flex;
          align-items: baseline;
          gap: 14px;
        }

        .hero h1 {
          margin: 0;
          font-size: 1.5rem;
          font-weight: 600;
          letter-spacing: 0.1em;
          color: var(--text);
          font-family: "Shippori Mincho", "游明朝", serif;
        }

        .version-badge {
          font-size: 0.7rem;
          padding: 3px 8px;
          border-radius: 4px;
          background: var(--accent-soft);
          color: var(--accent);
          border: 1px solid var(--line);
          font-weight: 500;
        }

        .hero-actions {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .panel {
          background: var(--panel);
          border: 1px solid var(--line);
          border-radius: 6px;
          box-shadow: var(--shadow);
        }

        .primary-button,
        .secondary-button {
          min-height: 36px;
          border: 1px solid var(--line);
          border-radius: 4px;
          padding: 0 14px;
          font-weight: 500;
          font-size: 0.85rem;
          transition: all 0.15s ease;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
        }

        .primary-button {
          background: var(--accent);
          color: #ffffff;
          border-color: var(--accent-dark);
        }

        .primary-button:hover {
          background: var(--accent-dark);
        }

        .secondary-button {
          background: var(--panel-sub);
          color: var(--text);
        }

        .secondary-button:hover:not(:disabled) {
          background: var(--accent-soft);
          border-color: var(--accent);
          color: var(--accent);
        }
      }

      @layer editor {
        .editor-grid {
          display: grid;
          grid-template-columns: 480px 1fr;
          gap: 20px;
          flex: 1;
          min-height: 0;
          align-items: stretch;
        }

        .editor-panel {
          display: flex;
          flex-direction: column;
          height: 100%;
          min-height: 0;
          overflow: hidden;
        }

        .editor-tabs {
          display: flex;
          background: var(--panel-sub);
          border-bottom: 1px solid var(--line);
          flex-shrink: 0;
        }

        .editor-tab-btn {
          flex: 1;
          padding: 12px 16px;
          background: transparent;
          border: none;
          border-bottom: 2px solid transparent;
          font-weight: 500;
          font-size: 0.86rem;
          color: var(--muted);
          text-align: center;
          cursor: pointer;
        }

        .editor-tab-btn.active {
          color: var(--accent);
          border-bottom-color: var(--accent);
          background: var(--panel);
          font-weight: 600;
        }

        .tab-content-area {
          padding: 18px;
          flex: 1;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
        }

        .tab-pane {
          display: none;
          height: 100%;
        }

        .tab-pane.active {
          display: flex;
          flex-direction: column;
        }

        .setting-group {
          border: 1px solid var(--line);
          border-radius: 4px;
          margin-bottom: 16px;
          background: var(--panel-sub);
          overflow: hidden;
          flex-shrink: 0;
        }

        .setting-group summary {
          padding: 12px 16px;
          font-weight: 500;
          font-size: 0.85rem;
          cursor: pointer;
          user-select: none;
          color: var(--text);
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .setting-group summary::-webkit-details-marker,
        .setting-group summary::marker {
          display: none;
          content: "";
        }

        .setting-group summary::after {
          content: "＋";
          font-size: 0.75rem;
          color: var(--muted);
        }

        .setting-group[open] summary::after {
          content: "－";
          color: var(--accent);
        }

        .setting-content {
          padding: 16px;
        }

        .form-row {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin-bottom: 12px;
        }

        .form-row.two-cols {
          grid-template-columns: repeat(2, 1fr);
          flex-shrink: 0;
        }

        .form-col {
          min-width: 0;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        }

        .field-label {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 6px;
          font-weight: 500;
          font-size: 0.78rem;
          color: var(--muted);
        }

        .title-input,
        .select-input {
          width: 100%;
          height: 38px;
          padding: 0 10px;
          font-size: 0.85rem;
          border: 1px solid var(--line);
          border-radius: 4px;
          background: var(--input-bg);
          color: var(--text);
          outline: none;
        }

        .text-input {
          width: 100%;
          flex: 1;
          min-height: 200px;
          padding: 14px;
          border: 1px solid var(--line);
          border-radius: 4px;
          background: var(--input-bg);
          color: var(--text);
          outline: none;
          resize: none;
          line-height: 1.8;
        }

        .controls-main {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 14px;
          flex-shrink: 0;
        }
      }

      @layer viewer {
        .preview-container {
          display: flex;
          flex-direction: column;
          height: 100%;
          min-height: 0;
          gap: 10px;
          overflow: hidden;
        }

        .preview-nav {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: var(--panel);
          border: 1px solid var(--line);
          border-radius: 6px;
          padding: 8px 16px;
          flex-shrink: 0;
          box-shadow: var(--shadow);
        }

        .page-nav-status {
          font-size: 0.88rem;
          font-weight: 600;
          color: var(--text);
          min-width: 130px;
          text-align: center;
          user-select: none;
        }

        .inline-code {
          font-family: monospace;
          background: rgba(0, 0, 0, 0.06);
          padding: 1px 4px;
          border-radius: 2px;
          font-size: 0.88em;
        }

        .preview-viewport {
          background-color: var(--panel-sub);
          border-radius: 6px;
          padding: 20px;
          height: 100%;
          overflow: hidden;
          border: 1px solid var(--line);
          display: flex;
          justify-content: center;
          align-items: center;
          position: relative;
        }

        .pages-container {
          display: flex;
          flex-direction: row-reverse;
          gap: 24px;
          justify-content: center;
          align-items: center;
          transition: transform 0.15s ease-out;
        }

        .paper-page {
          width: var(--paper-w);
          height: var(--paper-h);
          min-width: var(--paper-w);
          min-height: var(--paper-h);
          background: #fffefb;
          color: #1f2328;
          padding: var(--page-padding-v) var(--page-padding-h);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
          border-radius: 1px;
          box-sizing: border-box;
          position: relative;
          overflow: hidden;
          flex-shrink: 0;
        }

        .page-header-tag {
          position: absolute;
          top: 4mm;
          right: var(--page-padding-h);
          font-family: var(--doc-font-family);
          font-size: 0.65rem;
          color: #777777;
        }

        .page-number-tag {
          position: absolute;
          bottom: 4mm;
          left: 50%;
          transform: translateX(-50%);
          font-family: var(--doc-font-family);
          font-size: 0.68rem;
          color: #777777;
        }

        .md-body {
          writing-mode: vertical-rl;
          -webkit-writing-mode: vertical-rl;
          text-orientation: mixed;
          line-height: 1.8;
          font-family: var(--doc-font-family);
          font-size: var(--doc-font-size);
          width: 100%;
          box-sizing: border-box;
          line-break: strict;
          -webkit-line-break: strict;
          word-break: normal;
          overflow-wrap: anywhere;
          hanging-punctuation: allow-end;
          overflow: hidden;
        }

        .md-body .align-center {
          text-align: center;
          text-indent: 0 !important;
        }

        .md-body .align-right {
          text-align: right;
          text-indent: 0 !important;
        }

        .nobreak {
          display: inline;
          white-space: nowrap;
          text-indent: 0;
        }

        .paper-page:not(.has-columns) .md-body {
          height: 100%;
        }

        .columns-wrapper {
          display: flex;
          flex-direction: column;
          height: 100%;
          width: 100%;
          justify-content: space-between;
        }

        .paper-page.has-columns .md-body {
          height: calc(50% - 4mm);
        }

        .column-divider {
          border-top: 1px solid #d4cfc4;
          width: 100%;
          margin: 2mm 0;
          flex-shrink: 0;
        }

        .column-divider.no-border {
          border-top: none;
        }

        .md-body h1 {
          margin: 0 0 0 16px;
          font-size: 1.8em;
          border-left: 2px solid #1f2328;
          padding-left: 8px;
          line-height: 1.4;
        }

        .md-body h2 {
          margin: 0 10px 0 10px;
          padding-left: 6px;
          border-left: 1px solid #888;
          font-size: 1.3em;
          line-height: 1.5;
        }

        .md-body h3 {
          margin: 0 8px 0 8px;
          font-size: 1.1em;
          line-height: 1.6;
        }

        .md-body p {
          margin: 0;
          padding: 0;
          text-indent: 1em;
        }

        .md-body p.no-indent {
          text-indent: 0;
        }

        .md-body blockquote {
          margin: 0 8px;
          padding: 8px 4px;
          border-top: 2px solid var(--accent);
          background: #f6f4ee;
          font-size: 0.95em;
        }

        .md-body hr {
          margin: 0 12px;
          border: 0;
          border-right: 1px solid #d4cfc4;
          height: 100%;
        }

        .tcy {
          text-combine-upright: all;
          -webkit-text-combine: horizontal;
          display: inline;
          letter-spacing: 0;
        }

        .bouten {
          text-emphasis: filled sesame;
          -webkit-text-emphasis: filled sesame;
          text-emphasis-position: over right;
        }

        .paper-page.gutter-odd {
          padding-right: calc(var(--page-padding-h) + 6mm) !important;
        }

        .paper-page.gutter-even {
          padding-left: calc(var(--page-padding-h) + 6mm) !important;
        }
      }

      @media (max-width: 1100px) {
        html,
        body {
          height: auto;
          overflow: auto;
        }

        .app {
          height: auto;
        }

        .editor-grid {
          grid-template-columns: 1fr;
          height: auto;
        }

        .text-input {
          min-height: 350px;
        }

        .preview-viewport {
          max-height: 600px;
          height: 600px;
        }
      }

      @layer print {
        @media print {
          html,
          body {
            width: auto !important;
            height: auto !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #ffffff !important;
            color: #000000 !important;
            overflow: visible !important;
          }

          .no-print,
          .editor-panel,
          .hero {
            display: none !important;
          }

          .app {
            width: 100% !important;
            max-width: none !important;
            padding: 0 !important;
            margin: 0 !important;
            height: auto !important;
          }

          .editor-grid {
            display: block !important;
            height: auto !important;
          }

          .preview-viewport {
            background: transparent !important;
            padding: 0 !important;
            max-height: none !important;
            height: auto !important;
            overflow: visible !important;
            border: none !important;
            display: block !important;
          }

          .pages-container {
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            transform: none !important;
          }

          .paper-page {
            box-shadow: none !important;
            padding: var(--page-padding-v) var(--page-padding-h) !important;
            margin: 0 !important;
            width: var(--paper-w) !important;
            height: var(--paper-h) !important;
            page-break-after: always !important;
            break-after: page !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            overflow: hidden !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
          }

          .md-body {
            overflow: hidden !important;
          }

          .paper-page:last-child {
            page-break-after: auto !important;
            break-after: auto !important;
          }
        }
      }
    </style>
  </head>

  <body>
    <main class="app">
      <header class="hero no-print">
        <div class="hero-title-group">
          <h1>言ノ葉Editer</h1>
          <span class="version-badge">v0.11</span>
        </div>
        <div class="hero-actions">
          <select
            id="themeSelect"
            class="select-input"
            style="width: 110px; height: 36px"
          >
            <option value="standard">ライト</option>
            <option value="dark">ダーク</option>
            <option value="sepia" selected>セピア</option>
          </select>
          <button
            id="printButton"
            class="primary-button"
            type="button"
            style="height: 36px"
          >
            印刷・PDF出力
          </button>
        </div>
      </header>

      <div class="editor-grid">
        <section class="panel editor-panel no-print">
          <div class="editor-tabs">
            <button
              class="editor-tab-btn active"
              data-target="pane-text"
              type="button"
            >
              本文入力
            </button>
            <button
              class="editor-tab-btn"
              data-target="pane-typeset"
              type="button"
            >
              組版・設定
            </button>
          </div>

          <div class="tab-content-area">
            <div id="pane-text" class="tab-pane active">
              <div class="form-row two-cols" style="margin-bottom: 12px">
                <div class="form-col">
                  <div class="field-label">
                    <label for="pageTitle">表題（タイトル）</label>
                  </div>
                  <input
                    id="pageTitle"
                    class="title-input"
                    type="text"
                    placeholder="例：舞姫、怪異譚"
                  />
                </div>
                <div class="form-col">
                  <div class="field-label">
                    <label for="pageHeader">柱（ヘッダー）</label>
                  </div>
                  <input
                    id="pageHeader"
                    class="title-input"
                    type="text"
                    placeholder="例：第一章 ～目覚め～"
                  />
                </div>
              </div>

              <div class="field-label" style="margin-top: 8px">
                <label for="sourceText">本文テキスト</label>
                <small id="charCount">0文字</small>
              </div>
              <textarea
                id="sourceText"
                class="text-input"
                placeholder="ここに本文を入力してください。"
              ></textarea>

              <div class="controls-main">
                <button
                  id="importButton"
                  class="secondary-button"
                  type="button"
                >
                  ファイル開く
                </button>
                <button
                  id="exportButton"
                  class="secondary-button"
                  type="button"
                >
                  保存 (.txt)
                </button>
                <button
                  id="insertBreakButton"
                  class="secondary-button"
                  type="button"
                >
                  手動改ページ
                </button>
                <button
                  id="sampleButton"
                  class="secondary-button"
                  type="button"
                >
                  サンプル
                </button>
                <button id="clearButton" class="secondary-button" type="button">
                  消去
                </button>
                <input
                  type="file"
                  id="fileInput"
                  accept=".txt,.md"
                  style="display: none"
                />
              </div>
            </div>

            <div id="pane-typeset" class="tab-pane">
              <details class="setting-group" open>
                <summary>ヘッダー・ノンブル設定</summary>
                <div class="setting-content">
                  <div class="form-row">
                    <div class="form-col">
                      <div class="field-label">
                        <label for="headerDisplaySelect">ヘッダー表示</label>
                      </div>
                      <select id="headerDisplaySelect" class="select-input">
                        <option value="all" selected>全ページ</option>
                        <option value="odd">奇数ページのみ</option>
                        <option value="even">偶数ページのみ</option>
                        <option value="alternate">左右交互</option>
                      </select>
                    </div>
                    <div class="form-col">
                      <div class="field-label">
                        <label for="headerPosSelect">位置</label>
                      </div>
                      <select id="headerPosSelect" class="select-input">
                        <option value="right" selected>右上</option>
                        <option value="center">中央上</option>
                        <option value="left">左上</option>
                      </select>
                    </div>
                    <div class="form-col">
                      <div class="field-label">
                        <label for="headerSizeSelect">文字サイズ</label>
                      </div>
                      <select id="headerSizeSelect" class="select-input">
                        <option value="0.55rem">極小</option>
                        <option value="0.65rem" selected>標準</option>
                        <option value="0.75rem">大</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-row" style="margin-top: 10px">
                    <div class="form-col">
                      <div class="field-label">
                        <label for="nombreDisplaySelect">ノンブル表示</label>
                      </div>
                      <select id="nombreDisplaySelect" class="select-input">
                        <option value="all" selected>全ページ</option>
                        <option value="skip-first">1ページ目隠す</option>
                        <option value="off">非表示</option>
                      </select>
                    </div>
                    <div class="form-col">
                      <div class="field-label">
                        <label for="nombrePosSelect">位置</label>
                      </div>
                      <select id="nombrePosSelect" class="select-input">
                        <option value="center" selected>中央下</option>
                        <option value="right">右下</option>
                        <option value="left">左下</option>
                        <option value="alternate">左右交互</option>
                      </select>
                    </div>
                    <div class="form-col">
                      <div class="field-label">
                        <label for="startPageInput">開始ページ</label>
                      </div>
                      <input
                        id="startPageInput"
                        class="title-input"
                        type="number"
                        value="1"
                        min="1"
                      />
                    </div>
                  </div>
                </div>
              </details>

              <details class="setting-group" open>
                <summary>用紙・フォント・レイアウト</summary>
                <div class="setting-content">
                  <div class="form-row">
                    <div class="form-col">
                      <div class="field-label">
                        <label for="pageSizeSelect">用紙サイズ</label>
                      </div>
                      <select id="pageSizeSelect" class="select-input">
                        <option value="A4">A4</option>
                        <option value="B5">B5</option>
                        <option value="A5" selected>A5</option>

                        <option value="shippori" selected>
                          Shippori Mincho
                        </option>

        <!-- プレビュー表示エリア -->
        <div class="preview-container">
          <!-- ページコントロールバー -->

              id="prevPageBtn"

    </main>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        "use strict";

        const tabButtons = document.querySelectorAll(".editor-tab-btn");
        const tabPanes = document.querySelectorAll(".tab-pane");
        tabButtons.forEach((btn) => {
          btn.addEventListener("click", function () {
            tabButtons.forEach((b) => b.classList.remove("active"));
            tabPanes.forEach((p) => p.classList.remove("active"));
            this.classList.add("active");
            const target = document.getElementById(this.dataset.target);
            if (target) target.classList.add("active");
          });
        });

        const CONFIG_KEYS = {
          pageTitle: "title",
          pageHeader: "header",
          headerDisplaySelect: "headerDisplay",
          headerPosSelect: "headerPos",
          headerSizeSelect: "headerSize",
          fontSelect: "font",
          customFontUrl: "customFontUrl",
          customFontFamily: "customFontFamily",
          pageSizeSelect: "pageSize",
          columnSelect: "column",
          fontSizeSelect: "fontSize",
          marginSelect: "margin",
          gutterSelect: "gutter",
          themeSelect: "theme",
          sourceText: "text",
          columnRuleSelect: "columnRule",
          nombreDisplaySelect: "nombreDisplay",
          startPageInput: "startPage",
          nombrePosSelect: "nombrePos",
        };

        const els = {};
        Object.keys(CONFIG_KEYS).forEach((id) => {
          els[id] = document.getElementById(id);
        });

        const customFontRow = document.getElementById("customFontRow");
        const columnRuleCol = document.getElementById("columnRuleCol");
        const charCount = document.getElementById("charCount");
        const pagesContainer = document.getElementById("pagesContainer");
        const previewViewport = document.getElementById("previewViewport");
        const pageSizeStyle = document.getElementById("page-size-style");
        const fileInput = document.getElementById("fileInput");

        // ページナビゲーション用要素
        const nextPageBtn = document.getElementById("nextPageBtn");
        const prevPageBtn = document.getElementById("prevPageBtn");
        const pageNavStatus = document.getElementById("pageNavStatus");

        const STORAGE_KEY = "md_vertical_editor_draft_v09_" + location.pathname;
        let debounceTimer = null;
        let computedPagesData = [];
        let currentPageIndex = 0; // 見開きの先頭ページインデックス（0ベース）

        const PAGE_SIZES_MM = {
          A4: { w: 210, h: 297 },
          B5: { w: 182, h: 257 },
          A5: { w: 148, h: 210 },
          B6: { w: 128, h: 182 },
          A6: { w: 105, h: 148 },
          Hagaki: { w: 100, h: 148 },
        };

        const MARGIN_SIZES_MM = {
          narrow: { v: 12, h: 10 },
          normal: { v: 18, h: 14 },
          wide: { v: 24, h: 18 },
        };

        const FONTS = {
          shippori: '"Shippori Mincho", "Yu Mincho", "MS Mincho", serif',
          noto: '"Noto Serif JP", "Yu Mincho", "MS Mincho", serif',
          sawarabi: '"Sawarabi Mincho", "Yu Mincho", "MS Mincho", serif',
          system: '"Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif',
        };

        function mmToPx(mm) {
          return mm * 3.7795275591;
        }
        function ptToPx(pt) {
          return parseFloat(pt) * 1.3333333333;
        }

        function saveToStorage() {
          const data = {};
          for (const [id, key] of Object.entries(CONFIG_KEYS)) {
            if (els[id]) data[key] = els[id].value;
          }
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          } catch (e) {}
        }

        function loadFromStorage() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            for (const [id, key] of Object.entries(CONFIG_KEYS)) {
              if (data[key] !== undefined && els[id]) els[id].value = data[key];
            }
            if (data.theme !== undefined && els.themeSelect) {
              els.themeSelect.value = data.theme;
              document.documentElement.setAttribute("data-theme", data.theme);
            }
            if (
              els.fontSelect &&
              els.fontSelect.value === "custom" &&
              customFontRow
            ) {
              customFontRow.style.display = "flex";
            }
            return true;
          } catch (e) {
            return false;
          }
        }

        function updatePageCSSVariables() {
          const conf =
            PAGE_SIZES_MM[els.pageSizeSelect.value] || PAGE_SIZES_MM["A4"];
          const margin =
            MARGIN_SIZES_MM[els.marginSelect.value] ||
            MARGIN_SIZES_MM["normal"];

          let selectedFont = FONTS[els.fontSelect.value];
          if (els.fontSelect.value === "custom") {
            selectedFont = els.customFontFamily.value.trim() || "serif";
            const url = els.customFontUrl.value.trim();
            if (url) document.getElementById("dynamic-font-link").href = url;
          }

          document.documentElement.style.setProperty(
            "--paper-w",
            conf.w + "mm",
          );
          document.documentElement.style.setProperty(
            "--paper-h",
            conf.h + "mm",
          );
          document.documentElement.style.setProperty(
            "--doc-font-size",
            els.fontSizeSelect.value,
          );
          document.documentElement.style.setProperty(
            "--doc-font-family",
            selectedFont,
          );
          document.documentElement.style.setProperty(
            "--page-padding-v",
            margin.v + "mm",
          );
          document.documentElement.style.setProperty(
            "--page-padding-h",
            margin.h + "mm",
          );

          if (pageSizeStyle) {
            pageSizeStyle.innerHTML = `@page { size: ${conf.w}mm ${conf.h}mm; margin: 0; }`;
          }
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function parseInlineVerticalMarkdown(text) {
          let value = escapeHtml(text);
          const codeBlocks = [];
          value = value.replace(/`([^`]+)`/g, function (match, code) {
            codeBlocks.push('<code class="inline-code">' + code + "</code>");
            return "___CODE_PLACEHOLDER_" + (codeBlocks.length - 1) + "___";
          });

          value = value.replace(
            /《《([^》\n]+)》》/g,
            '<span class="bouten">$1</span>',
          );
          value = value.replace(
            /[\|｜]([^《\n]+)《([^》\n]+)》/g,
            "<ruby>$1<rt>$2</rt></ruby>",
          );
          value = value.replace(
            /([一-龯]+)《([^》\n]+)》/g,
            "<ruby>$1<rt>$2</rt></ruby>",
          );

          value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          value = value.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
          value = value.replace(
            /(!\?|\?!|!!|\?\?|！？|？！|！！|？？)/g,
            '<span class="tcy">$1</span>',
          );
          value = value.replace(/ (\d{1,2}) /g, '<span class="tcy">$1</span>');
          value = value.replace(
            /(――+|……+|──+)/g,
            '<span class="nobreak">$1</span>',
          );

          value = value.replace(
            /___CODE_PLACEHOLDER_(\d+)___/g,
            function (match, index) {
              return codeBlocks[index];
            },
          );

          return value;
        }

        function parseToAST(markdown) {
          const normalized = String(markdown).replace(/\r?\n/g, "\n");
          if (!normalized.trim()) return [];

          const rawSections = normalized.split(
            /(?:\n|^)\s*(?:\[改ページ\]|< !--\ s *pagebreak\ s*- ->)\s*(?=\n|$)/i,
          );
          const sections = [];

          rawSections.forEach((sectionStr) => {
            const lines = sectionStr.split("\n");
            const items = [];

            lines.forEach((line) => {
              const trimmed = line.trim();
              if (trimmed === "") {
                items.push({ type: "empty" });
                return;
              }

              let align = null;
              let textToParse = trimmed;

              const centerMatch = textToParse.match(
                /^(?:\[(?:中央|center)\]|［(?:中央|center)］)\s*(.*)$/i,
              );
              const rightMatch = textToParse.match(
                /^(?:\[(?:右|right)\]|［(?:右|right)］)\s*(.*)$/i,
              );

              if (centerMatch) {
                align = "center";
                textToParse = centerMatch[1];
              } else if (rightMatch) {
                align = "right";
                textToParse = rightMatch[1];
              }

              const heading = textToParse.match(/^(#{1,6})\s+(.+)$/);
              if (heading) {
                items.push({
                  type: "heading",
                  level: heading[1].length,
                  text: heading[2].trim(),
                  align: align,
                });
                return;
              }

              if (/^(?:-{3,}|\*{3,}|_{3,})$/.test(textToParse)) {
                items.push({ type: "hr" });
                return;
              }

              const quote = textToParse.match(/^>\s?(.*)$/);
              if (quote) {
                items.push({ type: "quote", text: quote[1], align: align });
                return;
              }

              const isBracket = /^[「『（【〔〈《“‘]/.test(textToParse);
              items.push({
                type: "p",
                isBracket,
                text: textToParse,
                align: align,
              });
            });

            if (items.length > 0) sections.push(items);
          });

          return sections;
        }

        function computeLayoutWithCanvas(text, title) {
          const pageSize =
            PAGE_SIZES_MM[els.pageSizeSelect.value] || PAGE_SIZES_MM["A4"];
          const margin =
            MARGIN_SIZES_MM[els.marginSelect.value] ||
            MARGIN_SIZES_MM["normal"];
          const fontSizePx = ptToPx(els.fontSizeSelect.value);
          const isTwoColumn = els.columnSelect.value === "2";

          const paperHPx = mmToPx(pageSize.h);
          const paperWPx = mmToPx(pageSize.w);
          const marginVPx = mmToPx(margin.v);
          const marginHPx = mmToPx(margin.h);

          // ヘッダー・フッター用のマージン（40px相当）を引いて高さの余白を適切に確保
          let colHPx = paperHPx - marginVPx * 2 - 40;
          if (isTwoColumn) {
            colHPx = (colHPx - mmToPx(6)) / 2;
          }

          const colWPx = paperWPx - marginHPx * 2;
          const lineSpacingPx = fontSizePx * 1.8;
          const maxLinesPerCol = Math.max(
            1,
            Math.floor((colWPx - 6) / lineSpacingPx),
          );

          function getCharHeight(ch, fontScale = 1.0) {
            if (/[a-zA-Z0-9\s]/.test(ch)) return fontSizePx * 0.55 * fontScale;
            return fontSizePx * fontScale;
          }

          function parseTextTokens(str) {
            const tokens = [];
            const pattern =
              /([\|｜][^《\n]+《[^》\n]+》)|([一-龯]+《[^》\n]+》)|(《《[^》\n]+》》)|(\*\*[^*]+\*\*)|(`[^`]+`)|([^\|｜《\*`]+|.)/g;
            let match;
            while ((match = pattern.exec(str)) !== null) {
              const raw = match[0];
              let display = raw;
              if (raw.startsWith("《《") && raw.endsWith("》》")) {
                display = raw.slice(2, -2);
              } else if (raw.includes("《") && raw.endsWith("》")) {
                display = raw.replace(/[\|｜]/g, "").replace(/《[^》]+》/g, "");
              } else if (raw.startsWith("**") && raw.endsWith("**")) {
                display = raw.slice(2, -2);
              } else if (raw.startsWith("`") && raw.endsWith("`")) {
                display = raw.slice(1, -1);
              }
              tokens.push({ raw, display });
            }
            return tokens;
          }

          function splitTextToLines(rawText, fontScale = 1.0) {
            const tokens = parseTextTokens(rawText);
            const lines = [];
            let currentRaw = "";
            let currentH = 0;

            for (let i = 0; i < tokens.length; i++) {
              const tok = tokens[i];
              let tokH = 0;
              for (let c = 0; c < tok.display.length; c++) {
                tokH += getCharHeight(tok.display[c], fontScale);
              }

              if (currentH + tokH > colHPx && currentRaw.length > 0) {
                lines.push(currentRaw);
                currentRaw = "";
                currentH = 0;
              }

              if (tokH > colHPx && tok.display.length > 1) {
                for (let c = 0; c < tok.raw.length; c++) {
                  const chRaw = tok.raw[c];
                  const chH = getCharHeight(chRaw, fontScale);
                  if (currentH + chH > colHPx && currentRaw.length > 0) {
                    lines.push(currentRaw);
                    currentRaw = "";
                    currentH = 0;
                  }
                  currentRaw += chRaw;
                  currentH += chH;
                }
                continue;
              }

              currentRaw += tok.raw;
              currentH += tokH;
            }

            if (currentRaw.length > 0) {
              lines.push(currentRaw);
            }

            return lines;
          }

          const sections = parseToAST(text);
          const pages = [];

          let currentPage = { pageIdx: 0, col1: [], col2: [] };
          let currentColIdx = 0;
          let currentLines = currentPage.col1;
          let currentLineWidth = 0;

          function addLineToPage(lineObj, widthCost = 1) {
            if (
              currentLineWidth + widthCost > maxLinesPerCol &&
              currentLines.length > 0
            ) {
              if (isTwoColumn && currentColIdx === 0) {
                currentColIdx = 1;
                currentLines = currentPage.col2;
                currentLineWidth = 0;
              } else {
                pages.push(currentPage);
                currentPage = { pageIdx: pages.length, col1: [], col2: [] };
                currentColIdx = 0;
                currentLines = currentPage.col1;
                currentLineWidth = 0;
              }
            }
            currentLines.push(lineObj);
            currentLineWidth += widthCost;
          }

          sections.forEach((items, sectionIdx) => {
            if (
              sectionIdx > 0 &&
              (currentPage.col1.length > 0 || currentPage.col2.length > 0)
            ) {
              pages.push(currentPage);
              currentPage = { pageIdx: pages.length, col1: [], col2: [] };
              currentColIdx = 0;
              currentLines = currentPage.col1;
              currentLineWidth = 0;
            }

            if (sectionIdx === 0 && title) {
              const titleLines = splitTextToLines(title, 1.8);
              titleLines.forEach((tLine) => {
                addLineToPage(
                  { type: "heading", level: 1, text: tLine, isTitle: true },
                  2.2,
                );
              });
            }

            items.forEach((item) => {
              if (item.type === "empty") {
                addLineToPage({ type: "empty" }, 1);
              } else if (item.type === "heading") {
                const scales = { 1: 1.8, 2: 1.3, 3: 1.1 };
                const costs = { 1: 2.2, 2: 1.6, 3: 1.3 };
                const scale = scales[item.level] || 1.0;
                const cost = costs[item.level] || 1.2;

                const hLines = splitTextToLines(item.text, scale);
                hLines.forEach((hLine) => {
                  addLineToPage(
                    {
                      type: "heading",
                      level: item.level,
                      text: hLine,
                      align: item.align,
                    },
                    cost,
                  );
                });
              } else if (item.type === "hr") {
                addLineToPage({ type: "hr" }, 1);
              } else if (item.type === "quote") {
                const qLines = splitTextToLines(item.text, 0.95);
                qLines.forEach((qLine) => {
                  addLineToPage(
                    { type: "quote", text: qLine, align: item.align },
                    1.1,
                  );
                });
              } else if (item.type === "p") {
                const pLines = splitTextToLines(item.text, 1.0);
                pLines.forEach((pLine, idx) => {
                  addLineToPage(
                    {
                      type: "p",
                      text: pLine,
                      isBracket: item.isBracket,
                      isIndent: idx === 0 && !item.isBracket && !item.align,
                      align: item.align,
                    },
                    1,
                  );
                });
              }
            });
          });

          if (currentPage.col1.length > 0 || currentPage.col2.length > 0) {
            pages.push(currentPage);
          }

          return pages;
        }

        function buildLinesHtml(lines) {
          if (!lines || lines.length === 0) return "";
          let html = "";
          lines.forEach((item) => {
            const alignClass = item.align ? ` align-${item.align}` : "";

            if (item.type === "empty") {
              html += '<p class="no-indent">&nbsp;</p>';
            } else if (item.type === "heading") {
              const clsAttr = alignClass ? ` class="${alignClass.trim()}"` : "";
              html += `<h${item.level}${clsAttr}>${parseInlineVerticalMarkdown(item.text)}</h${item.level}>`;
            } else if (item.type === "hr") {
              html += "<hr />";
            } else if (item.type === "quote") {
              const clsAttr = alignClass ? ` class="${alignClass.trim()}"` : "";
              html += `<blockquote${clsAttr}>${parseInlineVerticalMarkdown(item.text)}</blockquote>`;
            } else if (item.type === "p") {
              const classes = [];
              if (!item.isIndent || item.align) classes.push("no-indent");
              if (item.align) classes.push(`align-${item.align}`);

              const classAttr =
                classes.length > 0 ? ` class="${classes.join(" ")}"` : "";
              html += `<p${classAttr}>${parseInlineVerticalMarkdown(item.text)}</p>`;
            }
          });
          return html;
        }

        function renderPageDom(pageEl, pageIdx) {
          const pageData = computedPagesData[pageIdx];
          if (!pageData) return;

          const isTwoColumn = els.columnSelect.value === "2";
          const isGutterOn =
            els.gutterSelect && els.gutterSelect.value === "on";
          const startPageNum =
            parseInt(els.startPageInput ? els.startPageInput.value : 1, 10) ||
            1;
          const pageNum = pageIdx + startPageNum;
          const isOdd = (pageIdx + 1) % 2 !== 0;

          let gutterClass = "";
          if (isGutterOn) gutterClass = isOdd ? " gutter-odd" : " gutter-even";

          pageEl.className =
            "paper-page" + (isTwoColumn ? " has-columns" : "") + gutterClass;

          const headerText = els.pageHeader.value.trim();
          const displayVal = els.headerDisplaySelect.value;
          const posVal = els.headerPosSelect.value;
          const sizeVal = els.headerSizeSelect.value;

          let showHeader = false;
          if (headerText) {
            if (displayVal === "all" || displayVal === "alternate")
              showHeader = true;
            else if (displayVal === "odd" && isOdd) showHeader = true;
            else if (displayVal === "even" && !isOdd) showHeader = true;
          }

          let headerTagHtml = "";
          if (showHeader) {
            let currentPos = posVal;
            if (displayVal === "alternate")
              currentPos = isOdd ? "left" : "right";

            let posStyle = "";
            if (currentPos === "center")
              posStyle = "left: 50%; right: auto; transform: translateX(-50%);";
            else if (currentPos === "left")
              posStyle =
                "left: var(--page-padding-h); right: auto; transform: none;";
            else
              posStyle =
                "right: var(--page-padding-h); left: auto; transform: none;";

            headerTagHtml = `<div class="page-header-tag" style="font-size:${sizeVal}; ${posStyle}">${escapeHtml(headerText)}</div>`;
          }

          const showRule = els.columnRuleSelect
            ? els.columnRuleSelect.value === "on"
            : true;
          const dividerClass = showRule
            ? "column-divider"
            : "column-divider no-border";

          let bodyHtml = "";
          if (isTwoColumn) {
            bodyHtml =
              '<div class="columns-wrapper">' +
              `<article class="md-body col-top">${buildLinesHtml(pageData.col1)}</article>` +
              `<div class="${dividerClass}"></div>` +
              `<article class="md-body col-bottom">${buildLinesHtml(pageData.col2)}</article>` +
              "</div>";
          } else {
            bodyHtml = `<article class="md-body">${buildLinesHtml(pageData.col1)}</article>`;
          }

          const nombreVal = els.nombreDisplaySelect
            ? els.nombreDisplaySelect.value
            : "all";
          const nombrePosVal = els.nombrePosSelect
            ? els.nombrePosSelect.value
            : "center";

          let nombreHtml = "";
          if (
            nombreVal === "all" ||
            (nombreVal === "skip-first" && pageIdx > 0)
          ) {
            let currentNombrePos = nombrePosVal;
            if (nombrePosVal === "alternate")
              currentNombrePos = isOdd ? "left" : "right";

            let nombrePosStyle = "";
            if (currentNombrePos === "right")
              nombrePosStyle =
                "right: var(--page-padding-h); left: auto; transform: none;";
            else if (currentNombrePos === "left")
              nombrePosStyle =
                "left: var(--page-padding-h); right: auto; transform: none;";
            else
              nombrePosStyle =
                "left: 50%; right: auto; transform: translateX(-50%);";

            nombreHtml = `<div class="page-number-tag" style="${nombrePosStyle}">- ${pageNum} -</div>`;
          }

          pageEl.innerHTML = headerTagHtml + bodyHtml + nombreHtml;
        }

        // --- 画面枠に収まるようにプレビューページを動的縮小・フィットさせる関数 ---
        function fitPagesToViewport() {
          if (window.isPrinting) return;
          if (!previewViewport || !pagesContainer) return;

          pagesContainer.style.transform = "none";

          const pages = pagesContainer.querySelectorAll(".paper-page");
          if (pages.length === 0) return;

          const padding = 32;
          const availableW = previewViewport.clientWidth - padding;
          const availableH = previewViewport.clientHeight - padding;

          const containerW = pagesContainer.offsetWidth;
          const containerH = pagesContainer.offsetHeight;

          if (
            availableW <= 0 ||
            availableH <= 0 ||
            containerW <= 0 ||
            containerH <= 0
          )
            return;

          const scaleW = availableW / containerW;
          const scaleH = availableH / containerH;
          const scale = Math.min(1, scaleW, scaleH);

          if (scale < 0.999) {
            pagesContainer.style.transform = `scale(${scale})`;
            pagesContainer.style.transformOrigin = "center center";
          } else {
            pagesContainer.style.transform = "none";
          }
        }

        window.addEventListener("resize", fitPagesToViewport);

        // --- 見開き2ページプレビューの表示処理 ---
        function renderCurrentPages() {
          if (window.isPrinting) return;

          pagesContainer.innerHTML = "";
          pagesContainer.style.transform = "none";

          const total = computedPagesData.length;
          if (total === 0) {
            pagesContainer.innerHTML =
              '<div class="paper-page"><article class="md-body"><p style="color:#888;">ここに縦書きプレビューが表示されます。</p></article></div>';
            updatePageCounter();
            requestAnimationFrame(fitPagesToViewport);
            return;
          }

          // 偶数インデックス（0, 2, 4...）に調整
          if (currentPageIndex % 2 !== 0) {
            currentPageIndex = Math.max(0, currentPageIndex - 1);
          }
          if (currentPageIndex >= total) {
            currentPageIndex = Math.max(0, Math.floor((total - 1) / 2) * 2);
          }

          // 最大2ページのみをDOM生成してレンダリング
          const endIdx = Math.min(currentPageIndex + 2, total);
          for (let idx = currentPageIndex; idx < endIdx; idx++) {
            const pageEl = document.createElement("div");
            pageEl.className = "paper-page";
            pageEl.dataset.pageIndex = idx;
            pagesContainer.appendChild(pageEl);
            renderPageDom(pageEl, idx);
          }

          updatePageCounter();
          requestAnimationFrame(fitPagesToViewport);
        }

        // --- ページナビゲーション状態の更新 ---
        function updatePageCounter() {
          const total = computedPagesData.length;
          if (total === 0) {
            pageNavStatus.textContent = "0 / 0 ページ";
            nextPageBtn.disabled = true;
            prevPageBtn.disabled = true;
            return;
          }

          const endIdx = Math.min(currentPageIndex + 2, total);
          let statusStr = "";
          if (currentPageIndex + 1 === endIdx) {
            statusStr = `${currentPageIndex + 1} / ${total} ページ`;
          } else {
            statusStr = `${currentPageIndex + 1}-${endIdx} / ${total} ページ`;
          }
          pageNavStatus.textContent = statusStr;

          // 縦書き右開き：◀ 次のページ（インデックス増）、前のページ ▶（インデックス減）
          nextPageBtn.disabled = currentPageIndex + 2 >= total;
          prevPageBtn.disabled = currentPageIndex <= 0;
        }

        // ページ送りボタンイベント（次へ：+2ページ）
        nextPageBtn.addEventListener("click", function () {
          if (currentPageIndex + 2 < computedPagesData.length) {
            currentPageIndex += 2;
            renderCurrentPages();
          }
        });

        // ページ戻しボタンイベント（前へ：-2ページ）
        prevPageBtn.addEventListener("click", function () {
          if (currentPageIndex - 2 >= 0) {
            currentPageIndex -= 2;
            renderCurrentPages();
          }
        });

        function updatePreview() {
          if (columnRuleCol) {
            columnRuleCol.style.display =
              els.columnSelect.value === "2" ? "" : "none";
          }

          const totalChars = els.sourceText.value.length;
          const genkoPages = (totalChars / 400).toFixed(1);
          charCount.textContent =
            totalChars.toLocaleString("ja-JP") +
            "文字（400字詰：約" +
            genkoPages +
            "枚）";

          const title = els.pageTitle.value.trim();
          document.title = title || "言ノ葉Editer";

          updatePageCSSVariables();

          computedPagesData = computeLayoutWithCanvas(
            els.sourceText.value,
            title,
          );

          renderCurrentPages();
          saveToStorage();
        }

        function debounceUpdatePreview() {
          charCount.textContent =
            els.sourceText.value.length.toLocaleString("ja-JP") + "文字";
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(updatePreview, 250);
        }

        if (els.fontSelect) {
          els.fontSelect.addEventListener("change", function () {
            customFontRow.style.display =
              els.fontSelect.value === "custom" ? "flex" : "none";
            updatePreview();
          });
        }

        if (els.themeSelect) {
          els.themeSelect.addEventListener("change", function () {
            document.documentElement.setAttribute(
              "data-theme",
              els.themeSelect.value,
            );
            saveToStorage();
          });
        }

        const CHANGE_EVENT_IDS = [
          "pageSizeSelect",
          "columnSelect",
          "fontSizeSelect",
          "marginSelect",
          "gutterSelect",
          "headerDisplaySelect",
          "headerPosSelect",
          "headerSizeSelect",
          "nombrePosSelect",
          "columnRuleSelect",
          "nombreDisplaySelect",
        ];
        CHANGE_EVENT_IDS.forEach((id) => {
          if (els[id]) els[id].addEventListener("change", updatePreview);
        });

        const INPUT_EVENT_IDS = [
          "customFontUrl",
          "customFontFamily",
          "startPageInput",
          "sourceText",
          "pageTitle",
          "pageHeader",
        ];
        INPUT_EVENT_IDS.forEach((id) => {
          if (els[id]) els[id].addEventListener("input", debounceUpdatePreview);
        });

        document
          .getElementById("insertBreakButton")
          .addEventListener("click", function () {
            const insertText = "\n\n[改ページ]\n\n";
            const start = els.sourceText.selectionStart;
            const end = els.sourceText.selectionEnd;
            els.sourceText.value =
              els.sourceText.value.substring(0, start) +
              insertText +
              els.sourceText.value.substring(end);
            els.sourceText.selectionStart = els.sourceText.selectionEnd =
              start + insertText.length;
            els.sourceText.focus();
            updatePreview();
          });

        // ファイル保存機能 (txt形式)
        document
          .getElementById("exportButton")
          .addEventListener("click", function () {
            const text = els.sourceText.value;
            if (!text) {
              alert("保存する本文がありません。");
              return;
            }
            const title = els.pageTitle.value.trim() || "document";
            const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${title}.txt`;
            a.click();
            URL.revokeObjectURL(url);
          });

        // ファイル読み込み機能 (txt / md)
        document
          .getElementById("importButton")
          .addEventListener("click", function () {
            fileInput.click();
          });

        fileInput.addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function (evt) {
            els.sourceText.value = evt.target.result;

            const nameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
            if (!els.pageTitle.value.trim()) {
              els.pageTitle.value = nameWithoutExt;
            }

            currentPageIndex = 0;
            updatePreview();
            fileInput.value = "";
          };
          reader.readAsText(file, "UTF-8");
        });

        // --- 印刷用準備（全ページを一括出力） ---
        function prepareAllPagesForPrint() {
          window.isPrinting = true;
          pagesContainer.style.transform = "none";
          pagesContainer.innerHTML = "";
          computedPagesData.forEach((pageData, idx) => {
            const pageEl = document.createElement("div");
            pageEl.className = "paper-page";
            pageEl.dataset.pageIndex = idx;
            pagesContainer.appendChild(pageEl);
            renderPageDom(pageEl, idx);
          });
        }

        window.isPrinting = false;
        window.addEventListener("beforeprint", () => {
          prepareAllPagesForPrint();
        });

        window.addEventListener("afterprint", () => {
          window.isPrinting = false;
          renderCurrentPages();
        });

        document
          .getElementById("printButton")
          .addEventListener("click", function () {
            prepareAllPagesForPrint();
            requestAnimationFrame(() => {
              setTimeout(() => {
                window.print();
              }, 150);
            });
          });

        document
          .getElementById("sampleButton")
          .addEventListener("click", function () {
            els.pageTitle.value = "言ノ葉Editer 取扱説明書";
            els.pageHeader.value = "～機能と特殊記法のご案内～";
            els.fontSelect.value = "system";
            els.pageSizeSelect.value = "B6";
            els.fontSizeSelect.value = "9.5pt";

            els.sourceText.value =
              "『言ノ葉Editer』へようこそ。\n" +
              "このツールは、Markdown記法や独自の執筆用記法を使って、美しい縦書き文章をリアルタイムに作成・組版するためのエディタです。\n\n" +
              "[中央]― 寄せの機能表記例 ―\n" +
              "[右]執筆者：言ノ葉太郎\n\n" +
              "## 1. 執筆用記法（ルビ・傍点・配置）\n\n" +
              "小説執筆に欠かせないルビ（ふりがな）や傍点（圏点）、配置の指定に対応しています。\n\n" +
              "・ルビ指定：`｜漢字《かんじ》` または `漢字《かんじ》`\n" +
              "（例：｜瑠璃《るり》色の空に、鳳凰《ほうおう》が舞う。）\n\n" +
              "・傍点指定：`《《強調したい文字》》`\n" +
              "（例：ここが《《一番重要な場面》》です。）\n\n" +
              "・中央寄せ：`[中央]文字` または `[center]文字`\n" +
              "・右寄せ（下寄せ）：`[右]文字` または `[right]文字`\n\n" +
              "## 2. 縦中横の自動変換\n\n" +
              "半角数字（1〜2桁）や、連続する感嘆符・疑問符は、自動的に縦中横に変換されます。\n\n" +
              "・数字指定：`12`月 `31`日\n" +
              "（例：12月31日 15時03分）\n\n" +
              "・記号指定：`!?` `？！` `！！` など\n" +
              "（例：本当!? 嘘で嘘でしょ？！ 信じられない！！）\n\n" +
              "## 3. Markdown記法と装飾\n\n" +
              "標準的なMarkdown記法で文章を修飾できます。\n\n" +
              "・太字指定：`**太字**`（例：**ここが太字**）\n" +
              "・見出し：`# 見出し1` や `## 見出し2` を使用\n" +
              "・引用枠：行頭に `>` をつける\n\n" +
              "> 引用枠は、作中の手紙や古文書、回想シーン、または注釈などの表現に活用できます。\n\n" +
              "[改ページ]\n\n" +
              "## 4. ページ制御と印刷・PDF保存\n\n" +
              "・手動改ページ：独立した行に `[改ページ]` と入力すると、任意の位置で次のページへ送ることができます。\n" +
              "・印刷・PDF保存：画面右上のボタンを押すことで、プレビュー通りの縦書きレイアウトで印刷やPDF出力が可能です。\n\n" +
              "## 5. 各種レイアウト設定\n\n" +
              "画面左側の「組版・設定」タブから、以下の項目を自在に変更できます。\n\n" +
              "・用紙サイズ（A4、B5、A5、B6、A6、ハガキ）\n" +
              "・段組（1段組 / 上下2段組）\n" +
              "・本文文字サイズ、余白、のど（綴じ代）設定\n" +
              "・明朝体フォントの変更（しっぽり明朝、Noto Serif JPなど）\n" +
              "・UIテーマ（ダーク、ライト、セピア）\n\n" +
              "入力したテキストや設定はブラウザに自動保存されますので、安心してご執筆をお楽しみください。";

            currentPageIndex = 0;
            updatePreview();
          });

        document
          .getElementById("clearButton")
          .addEventListener("click", function () {
            if (confirm("入力した内容をすべて消去しますか？")) {
              els.pageTitle.value = "";
              els.pageHeader.value = "";
              els.sourceText.value = "";
              localStorage.removeItem(STORAGE_KEY);
              currentPageIndex = 0;
              updatePreview();
              els.sourceText.focus();
            }
          });

        loadFromStorage();
        updatePreview();
      });
    </script>
  </body>
</html>
